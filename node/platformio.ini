; Sensor node (one per box): DHT22 + reed switch -> ESP-NOW -> gateway
[env:node]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; SIMULATE_SENSOR: 1 = fake readings (no hardware needed), 0 = real sensors
; NODE_ID (node only): box_A / box_B
build_flags =
    -I../common
    -DNODE_ID=\"box_A\"
    -DSIMULATE_SENSOR=1
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
