; Sensor node (one per box): DHT22 + reed switch -> ESP-NOW -> gateway
;   pio run -d node -e box_A -t upload      (first box)
;   pio run -d node -e box_B -t upload      (second box)
; SIMULATE_SENSOR: 1 = fake DHT22 readings (no sensor needed), 0 = real DHT22

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -I../common
    -DSIMULATE_SENSOR=1

[env:box_A]
build_flags = ${env.build_flags} -DNODE_ID=\"box_A\"

[env:box_B]
build_flags = ${env.build_flags} -DNODE_ID=\"box_B\"
