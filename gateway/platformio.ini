; Gateway: receives ESP-NOW from nodes, reads local sensors, MQTT/TLS to NETPIE, drives the fans
;   pio run -d gateway -e gateway -t upload            (USB)
;   LENSGUARD_OTA_PASSWORD=... pio run -d gateway -e gateway_ota -t upload   (over Wi-Fi, E6)
; SIMULATE_SENSOR: 1 = fake DS18B20/LDR/MQ-135 readings (no sensors needed), 0 = real sensors

[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../common
    -DSIMULATE_SENSOR=1
lib_deps =
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.0.4

[env:gateway_ota]
extends = env:gateway
upload_protocol = espota
upload_port = lensguard-gw.local          ; or the IP printed on the serial log
upload_flags =
    --auth=${sysenv.LENSGUARD_OTA_PASSWORD}
