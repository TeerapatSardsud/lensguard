; Gateway: receives ESP-NOW from nodes, reads local sensors, MQTT/TLS to NETPIE, drives fan
[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; SIMULATE_SENSOR: 1 = fake readings (no hardware needed), 0 = real sensors
; NODE_ID (node only): box_A / box_B
build_flags =
    -I../common
    -DSIMULATE_SENSOR=1
lib_deps =
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.0.4
