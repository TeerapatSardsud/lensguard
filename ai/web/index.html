<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LensGuard Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: blue app bar -> 1 Overview (Box A, Box B, Gateway) -> 2 Humidity chart -> 3 Alerts | Events.
   Palette follows Facebook's light blue theme; fonts are loopless Thai (Prompt for numbers/headings, Noto Sans Thai for text). */
:root {
  color-scheme: light;
  --bg: #f0f2f5; --surface: #ffffff; --surface-2: #f0f2f5; --line: #e4e6eb;
  --ink: #050505; --ink-2: #65676b; --muted: #8a8d91;
  --blue: #1877f2; --blue-ink: #ffffff; --blue-soft: #e7f0fd;
  --s1: #1877f2; --s2: #eb6834;
  --good: #31a24c; --warning: #d9960a; --serious: #e8692b; --critical: #e41e3f;
  --grid: #e4e6eb; --axis: #ced0d4;
  --r: 12px; --shadow: 0 1px 2px rgba(0,0,0,.08);
  --display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --text: "Noto Sans Thai", "Prompt", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #18191a; --surface: #242526; --surface-2: #3a3b3c; --line: #3e4042;
    --ink: #e4e6eb; --ink-2: #b0b3b8; --muted: #8a8d91;
    --blue: #2d88ff; --blue-ink: #ffffff; --blue-soft: #263951;
    --s1: #4599ff; --s2: #e8692b;
    --good: #45bd62; --warning: #f7b928; --serious: #f0803c; --critical: #f3425f;
    --grid: #3e4042; --axis: #4e5052; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #18191a; --surface: #242526; --surface-2: #3a3b3c; --line: #3e4042;
  --ink: #e4e6eb; --ink-2: #b0b3b8; --muted: #8a8d91;
  --blue: #2d88ff; --blue-ink: #ffffff; --blue-soft: #263951;
  --s1: #4599ff; --s2: #e8692b;
  --good: #45bd62; --warning: #f7b928; --serious: #f0803c; --critical: #f3425f;
  --grid: #3e4042; --axis: #4e5052; --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--text); }
h1, h2, h3, .num { font-family: var(--display); font-weight: 600; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, .chart:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* app bar */
.bar { background: var(--blue); color: var(--blue-ink); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 5; }
.bar .in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; flex: none; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.brand h1 { font-size: 19px; line-height: 1.1; color: var(--blue-ink); }
.brand p { margin: 0; font-size: 12px; opacity: .85; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 13px;
  background: rgba(255,255,255,.16); color: var(--blue-ink); white-space: nowrap; }
.pill.btn:hover { background: rgba(255,255,255,.26); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.6); flex: none; }
.dot.live { background: #7ee787; } .dot.dead { background: #ffb3b3; }
.dot.on { background: var(--good); } .dot.off { background: var(--critical); }
@media (max-width: 560px) { .brand p, .tl { display: none; } .pill { padding: 5px 10px; font-size: 12px; } .brand h1 { font-size: 17px; } .logo { width: 30px; height: 30px; } }

/* page */
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 24px; }
.banner { background: color-mix(in srgb, var(--warning) 18%, var(--surface)); border-left: 4px solid var(--warning);
  border-radius: var(--r); padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.banner[hidden] { display: none; }   /* .banner's display:flex overrides the hidden attribute without this */
main { display: grid; gap: 24px; transition: opacity .2s; }
main.stale { opacity: .55; }
section > .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.sec h2 { font-size: 17px; }
.sec .hint { font-size: 13px; color: var(--ink-2); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.key { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.status { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-align: right; }
.card-head, .sec { min-width: 0; } .card-head h3 { flex: none; }

/* 1. overview: two boxes get the width, gateway is the narrower third column */
.overview { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,.85fr); gap: 16px; }
@media (max-width: 900px) { .overview { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .overview .gw { grid-column: 1 / -1; } }
@media (max-width: 600px) { .overview { grid-template-columns: minmax(0,1fr); } }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 14px 0 16px; flex-wrap: wrap; }
.hero .num { font-size: 56px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero .unit { font-size: 16px; color: var(--ink-2); margin-left: 4px; font-family: var(--text); font-weight: 500; }
.card.off .hero .num { color: var(--muted); }
.state { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 500;
  background: var(--surface-2); color: var(--ink); max-width: 100%; }
.state svg { width: 15px; height: 15px; flex: none; }
.state.good { background: color-mix(in srgb, var(--good) 15%, var(--surface)); color: color-mix(in srgb, var(--good) 75%, var(--ink)); }
.state.warning { background: color-mix(in srgb, var(--warning) 18%, var(--surface)); color: color-mix(in srgb, var(--warning) 70%, var(--ink)); }
.state.serious { background: color-mix(in srgb, var(--serious) 16%, var(--surface)); color: color-mix(in srgb, var(--serious) 75%, var(--ink)); }
.state.critical { background: color-mix(in srgb, var(--critical) 14%, var(--surface)); color: color-mix(in srgb, var(--critical) 80%, var(--ink)); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--ink-2); display: block; }
.stat .v { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px; min-width: 0; }
.stat .v > :last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .v svg { width: 15px; height: 15px; flex: none; }
.stat.alert .v { color: var(--critical); }
.fan-ico.spin { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .fan-ico.spin { animation: none; } }
.ai { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.row span:first-child { color: var(--ink-2); }
.row b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.row .why { color: var(--ink-2); font-weight: 400; }
.gw .rows { display: grid; gap: 8px; margin-top: 12px; }
.gw .row { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.gw .row:last-child { border-bottom: 0; padding-bottom: 0; }

/* 2. chart */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.seg button { padding: 5px 14px; border-radius: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--blue); box-shadow: var(--shadow); }
.tbtn { padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--blue); background: var(--blue-soft); font-weight: 500; }
.chart-card { position: relative; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { width: 100%; display: block; margin-top: 6px; touch-action: pan-y; }
.chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--text); }
.chart .end { fill: var(--ink); font-size: 12px; font-weight: 600; }
.chart .thr { fill: var(--ink-2); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); box-shadow: 0 6px 24px rgba(0,0,0,.18); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font-size: 13px; min-width: 170px; display: none; z-index: 2; }
.tip .t { color: var(--ink-2); margin-bottom: 6px; font-size: 12px; }
.tip .r { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.tip .r b { font-size: 15px; font-variant-numeric: tabular-nums; } .tip .r span { color: var(--ink-2); }
.tip .k { width: 12px; height: 2px; border-radius: 1px; flex: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
.table-wrap { max-height: 360px; overflow: auto; margin-top: 10px; }

/* 3. alerts | events */
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0,1fr); } }
.list .when { max-width: 40%; white-space: normal; text-align: right; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: start; }
.list li:last-child { border-bottom: 0; }
.list .when { color: var(--muted); font-size: 12px; white-space: nowrap; padding-top: 2px; }
.list .txt { white-space: pre-line; }
.list svg { width: 18px; height: 18px; margin-top: 2px; }
.foot { font-size: 12px; color: var(--muted); margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="bar"><div class="in">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="5"/><path d="M4 8h3l2-3h6l2 3h3v12H4z"/></svg>
    </div>
    <div><h1>LensGuard</h1><p>Smart Dry Cabinet · TuaKorm</p></div>
  </div>
  <span class="pill" id="conn"><span class="dot"></span><span data-i18n="conn.init">กำลังเชื่อมต่อ…</span></span>
  <button class="pill btn" id="langBtn" type="button" data-i18n-aria="lang.aria" aria-label="สลับภาษา TH/EN"><span id="langVal">TH</span></button>
  <button class="pill btn" id="theme" type="button" data-i18n-aria="theme.aria" aria-label="สลับ theme"><span class="tl">Theme: </span><span id="themeVal">Auto</span></button>
</div></div>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <main id="main">
    <section aria-labelledby="ovTitle">
      <div class="sec"><h2 id="ovTitle">Overview</h2><span class="hint" data-i18n="ov.hint">ค่าล่าสุดจากกล่องทั้งสองใบและ gateway</span></div>
      <div class="overview" id="cards"></div>
    </section>

    <section class="card chart-card" aria-labelledby="chartTitle">
      <div class="sec">
        <h2 id="chartTitle">Humidity <span class="hint">%RH</span></h2>
        <div class="toolbar" role="toolbar" data-i18n-aria="range.aria" aria-label="ช่วงเวลา">
          <div class="seg" id="range">
            <button type="button" data-min="60" data-i18n="r.1h">1 ชม.</button>
            <button type="button" data-min="360" data-i18n="r.6h">6 ชม.</button>
            <button type="button" data-min="1440" data-i18n="r.24h">24 ชม.</button>
          </div>
          <button class="tbtn" id="tableBtn" type="button" aria-pressed="false">Table</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <svg class="chart" id="chart" tabindex="0" role="img" data-i18n-aria="chart.aria" aria-label="กราฟความชื้นย้อนหลัง ใช้ปุ่มลูกศรซ้ายขวาเพื่ออ่านค่า"></svg>
      <div class="tip" id="tip" role="status"></div>
      <div class="table-wrap" id="tableWrap" hidden></div>
    </section>

    <div class="grid2">
      <section class="card" aria-labelledby="alertTitle">
        <div class="card-head"><h3 id="alertTitle">Alerts</h3><span class="status" data-i18n="alerts.sub">ส่งเข้า Telegram ด้วย</span></div>
        <ul class="list" id="alerts"></ul>
      </section>
      <section class="card" aria-labelledby="evTitle">
        <div class="card-head"><h3 id="evTitle">Events</h3><span class="status">Fan / Gateway</span></div>
        <ul class="list" id="events"></ul>
      </section>
    </div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<script>
"use strict";
const BOXES = [["box_A", "Box A", "--s1"], ["box_B", "Box B", "--s2"]];
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let state = null, range = Number(store.get("lg.range", "360")), showTable = false, cursor = null;

// ---------- i18n (TH default, EN switch; choice persists in localStorage) ----------
const I18N = {
  th: {
    "lang.aria": "สลับภาษา TH/EN", "theme.aria": "สลับ theme",
    "conn.init": "กำลังเชื่อมต่อ…", "conn.waiting": "รอข้อมูลจาก gateway", "conn.err": "ขาดการเชื่อมต่อกับ AI service",
    "ov.hint": "ค่าล่าสุดจากกล่องทั้งสองใบและ gateway", "range.aria": "ช่วงเวลา",
    "r.1h": "1 ชม.", "r.6h": "6 ชม.", "r.24h": "24 ชม.",
    "chart.aria": "กราฟความชื้นย้อนหลัง ใช้ปุ่มลูกศรซ้ายขวาเพื่ออ่านค่า",
    "alerts.sub": "ส่งเข้า Telegram ด้วย",
    "ago.s": "{n} วินาทีที่แล้ว", "ago.m": "{n} นาทีที่แล้ว", "ago.h": "{n} ชม.ที่แล้ว", "ago.d": "{n} วันที่แล้ว",
    "dur.lt1": "ไม่ถึงนาที", "dur.m": "{m} นาที", "dur.h": "{h} ชม. {m} นาที",
    "rh.none": "ไม่มีข้อมูล", "rh.mold": "ชื้นเกิน เสี่ยงเชื้อรา", "rh.fan": "ชื้น Fan ควรทำงาน",
    "rh.watch": "เริ่มชื้น เฝ้าดู", "rh.good": "แห้งกำลังดี", "rh.offline": "ไม่ได้รับข้อมูล",
    "why.ai": "AI สั่ง", "why.fallback": "กฎสำรองของ gateway", "why.timeout": "ครบ 30 นาที พักเครื่อง",
    "why.no_data": "ไม่มีข้อมูลจากกล่อง", "why.ota": "กำลัง update firmware",
    "door.open": "เปิด", "door.closed": "ปิด",
    "ai.pred": "AI forecast อีก 10 นาที", "ai.warming": "กำลังเก็บข้อมูล (16 นาที)", "ai.fanwhy": "Fan {v} เพราะ",
    "sensor.bad": "อ่านค่าไม่ได้",
    "gw.ambient": "Temp นอกกล่อง", "gw.exc": "ดีมาก", "gw.good": "ดี", "gw.fair": "พอใช้", "gw.weak": "อ่อน",
    "gw.buffer": "Buffer รอส่ง", "gw.items": "{n} รายการ", "gw.rx": "Packets รับ (ซ้ำ)",
    "gw.nomodel": "ไม่มี ใช้กฎสำรอง", "gw.nodes": "Node อื่นที่พบ",
    "chart.empty": "ยังไม่มีข้อมูลในช่วงเวลานี้",
    "tbl.caption": "ค่าความชื้นรายนาที ล่าสุดอยู่บน", "tbl.time": "เวลา", "tbl.hide": "ซ่อน table",
    "alerts.empty": "ยังไม่มีการแจ้งเตือน", "events.empty": "ยังไม่มีเหตุการณ์",
    "ev.silica": "{box}: silica gel น่าจะอิ่มตัว (fan 30 นาที ความชื้น{tail} %)",
    "ev.silica_a": "ลดลงแค่ {v}", "ev.silica_b": "กลับเพิ่มขึ้น {v}", "ev.boot": "Gateway เริ่มทำงาน ({d})",
    "legend.thr": "เส้นประ = เกณฑ์ fan และ alert",
    "foot": "Refresh ทุก 5 วินาที · เกณฑ์: Fan ON {on} % · Fan OFF {off} % · Alert {al} % · ข้อมูลดิบเก็บบน NETPIE",
    "banner.stale": "ไม่ได้ข้อมูลใหม่มาราว {dur} (รับล่าสุด {last}) — ตรวจ gateway / เครือข่าย / NETPIE; พัดลมยังใช้กฎสำรอง 55/45 ที่ gateway ได้",
  },
  en: {
    "lang.aria": "Switch language TH/EN", "theme.aria": "Switch theme",
    "conn.init": "Connecting…", "conn.waiting": "Waiting for gateway data", "conn.err": "Cannot reach the AI service",
    "ov.hint": "Latest readings from both boxes and the gateway", "range.aria": "Time range",
    "r.1h": "1 h", "r.6h": "6 h", "r.24h": "24 h",
    "chart.aria": "Humidity history chart; use left/right arrow keys to read values",
    "alerts.sub": "Also sent to Telegram",
    "ago.s": "{n}s ago", "ago.m": "{n} min ago", "ago.h": "{n} h ago", "ago.d": "{n} d ago",
    "dur.lt1": "<1 min", "dur.m": "{m} min", "dur.h": "{h}h {m}m",
    "rh.none": "No data", "rh.mold": "Too humid — mold risk", "rh.fan": "Humid — fan should be ON",
    "rh.watch": "Getting humid — watch", "rh.good": "Nicely dry", "rh.offline": "No data received",
    "why.ai": "AI command", "why.fallback": "Gateway backup rule", "why.timeout": "30-min limit — fan resting",
    "why.no_data": "No data from the box", "why.ota": "Firmware update in progress",
    "door.open": "Open", "door.closed": "Closed",
    "ai.pred": "AI forecast (next 10 min)", "ai.warming": "Collecting data (16 min)", "ai.fanwhy": "Fan {v} because",
    "sensor.bad": "Sensor not reading",
    "gw.ambient": "Ambient temp", "gw.exc": "Excellent", "gw.good": "Good", "gw.fair": "Fair", "gw.weak": "Weak",
    "gw.buffer": "Send queue", "gw.items": "{n} pending", "gw.rx": "Packets rx (dup)",
    "gw.nomodel": "none — fallback rule", "gw.nodes": "Other nodes seen",
    "chart.empty": "No data in this range",
    "tbl.caption": "Minute-by-minute humidity, newest first", "tbl.time": "Time", "tbl.hide": "Hide table",
    "alerts.empty": "No alerts yet", "events.empty": "No events yet",
    "ev.silica": "{box}: silica gel likely saturated (30 min of fan: RH {tail} %)",
    "ev.silica_a": "dropped only {v}", "ev.silica_b": "rose by {v}", "ev.boot": "Gateway started ({d})",
    "legend.thr": "Dashed lines = fan & alert thresholds",
    "foot": "Refreshes every 5s · Fan ON {on}% · Fan OFF {off}% · Alert {al}% · raw data stored on NETPIE",
    "banner.stale": "No new data for about {dur} (last received {last}) — check the gateway / network / NETPIE; the gateway still runs its 55/45 backup fan rule.",
  },
};
let lang = ["th", "en"].includes(store.get("lg.lang", "th")) ? store.get("lg.lang", "th") : "th";

    if (!r.ok) throw new Error(r.status);
    state = await r.json(); render(state);
  } catch {
    setConn(false, t("conn.err"));
  }
}
function setRange(min) {
  range = min; store.set("lg.range", String(min));
  for (const b of $("range").children) b.setAttribute("aria-pressed", String(Number(b.dataset.min) === min));
  poll();
}
$("range").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setRange(Number(b.dataset.min)); });
$("tableBtn").addEventListener("click", () => {
  showTable = !showTable; $("tableBtn").setAttribute("aria-pressed", String(showTable));
  $("tableBtn").textContent = showTable ? t("tbl.hide") : "Table"; if (state) drawTable(state);
});
$("langBtn").addEventListener("click", () => {
  lang = lang === "th" ? "en" : "th"; store.set("lg.lang", lang); applyLang();
});
const THEMES = ["auto", "light", "dark"], TNAME = { auto: "Auto", light: "Light", dark: "Dark" };
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("themeVal").textContent = TNAME[t]; store.set("lg.theme", t); if (state) render(state);
}
$("theme").addEventListener("click", () => {
  const cur = store.get("lg.theme", "auto"); applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % 3]);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state && render(state));
let resizeT; new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => state && drawChart(state), 120); }).observe($("chart"));
const urlTheme = new URLSearchParams(location.search).get("theme");
applyTheme(THEMES.includes(urlTheme) ? urlTheme : store.get("lg.theme", "auto"));
applyLang();
setRange([60, 360, 1440].includes(range) ? range : 360);
setInterval(poll, 5000);
</script>
</body>
